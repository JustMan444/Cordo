version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cordo-postgres
    ports:
      - "5454:5432"
    environment:
      POSTGRES_DB: DataBase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 41424344
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DataBase"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cordo-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cordo-app
    ports:
      - "8080:8080"
    environment:
      # --- Postgres ---
      # Внутри docker-сети порт ВСЕГДА 5432 (не 5454!)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/DataBase
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 41424344
      # --- Redis ---
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: